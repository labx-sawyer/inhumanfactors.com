baseURL = 'https://inhumanfactors.com/'
locale = 'en-us'
title = 'Inhuman Factors'
theme = 'PaperMod'
paginate = 10

[params]
  env = "production"
  description = "Where human factors meets the inhuman"
  author = "Ben D. Sawyer"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  defaultTheme = "auto"
  ShowToc = true

  # Site-wide cover image — shows on home page
  [params.cover]
    image = "images/hero.jpg"
    alt = "Janus coin"
    relative = false

  [params.homeInfoParams]
    Title = "Inhuman Factors"
    Content = "Where human factors meets the inhuman"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/labx-sawyer"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    codeFences = true
    lineNos = true
    style = "monokai"
