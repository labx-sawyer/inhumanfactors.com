name: Deploy Hugo to DreamHost

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.159.2
    steps:
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify

      - name: Deploy to DreamHost
        env:
          DREAMHOST_PASSWORD: ${{ secrets.DREAMHOST_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "$DREAMHOST_PASSWORD" rsync -avz --delete \
            --exclude='google1172e200c978db74.html' \
            -e "ssh -o StrictHostKeyChecking=no" \
            public/ inhumanfactors@inhumanfactors.com:inhumanfactors.com/
